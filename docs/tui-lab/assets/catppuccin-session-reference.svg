<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680"><g font-family="DejaVu Sans Mono, monospace"><rect x="0" y="0" width="1120" height="680" fill="#1e1e2e"/><text x="32" y="36" fill="#cdd6f4" font-size="17" font-weight="bold">Refine the terminal composer</text><text x="32" y="59" fill="#9399b2" font-size="12">session / ui-refresh</text><rect x="908" y="0" width="212" height="680" fill="#181825"/><text x="932" y="37" fill="#cdd6f4" font-size="14" font-weight="bold">Context</text><text x="932" y="65" fill="#9399b2" font-size="11">8.2k / 200k · 4%</text><text x="932" y="140" fill="#cdd6f4" font-size="14" font-weight="bold">Workspace</text><text x="932" y="168" fill="#9399b2" font-size="11">myagent · main</text><text x="932" y="245" fill="#cdd6f4" font-size="14" font-weight="bold">Changes</text><text x="932" y="273" fill="#9399b2" font-size="11">2 files · +28 −11</text><text x="932" y="346" fill="#cdd6f4" font-size="14" font-weight="bold">Plan</text><text x="932" y="374" fill="#9399b2" font-size="11">✓ inspect composer</text><text x="932" y="428" fill="#cdd6f4" font-size="14" font-weight="bold">Language servers</text><text x="932" y="456" fill="#a6e3a1" font-size="11">● gopls connected</text><text x="932" y="396" fill="#9399b2" font-size="11">○ verify snapshots</text><rect x="32" y="92" width="836" height="62" fill="#181825"/><rect x="32" y="92" width="3" height="62" fill="#89b4fa"/><text x="56" y="129" fill="#cdd6f4" font-size="16">Make the composer feel more like myagent.</text><text x="56" y="196" fill="#9399b2" font-size="14">Thinking: keep the layout; refine the details.</text><text x="56" y="241" fill="#cdd6f4" font-size="16">→ Read src/ui/composer.go</text><rect x="78" y="256" width="768" height="110" fill="#181825"/><text x="92" y="281" fill="#cba6f7" font-size="14">func (s *Shell) Render(w, h int) string {</text><text x="92" y="303" fill="#cdd6f4" font-size="14">    prompt := s.composer.Render(w, h)</text><text x="92" y="325" fill="#89b4fa" font-size="14">    return s.root.Compose(prompt)</text><text x="92" y="347" fill="#9399b2" font-size="14">}</text><text x="56" y="420" fill="#cdd6f4" font-size="16">A quieter interface, with a small identity of its own.</text><text x="56" y="451" fill="#9399b2" font-size="14">The diamond marks the agent. Tool status stays semantic.</text><text x="56" y="482" fill="#89b4fa" font-size="12">▣  Build · Claude Sonnet 4.5 · 1.4s</text><rect x="32" y="532" width="836" height="104" fill="#181825"/><rect x="32" y="532" width="3" height="104" fill="#89b4fa"/><text x="56" y="567" fill="#9399b2" font-size="17">Ask anything…</text><rect x="56" y="549" width="9" height="23" fill="#9399b2"/><text x="56" y="611" fill="#89b4fa" font-size="15">Build</text><text x="130" y="611" fill="#cdd6f4" font-size="15">Claude Sonnet 4.5</text><text x="358" y="611" fill="#9399b2" font-size="14">Anthropic</text><text x="645" y="662" fill="#9399b2" font-size="12">tab agents   / commands</text></g></svg>